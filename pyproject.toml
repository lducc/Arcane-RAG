[project]
name = "arcane-rag"
version = "0.1.0"
description = "Vietnamese legal document retrieval with BM25 + FAISS dense search + RRF fusion"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6",
    "faiss-cpu>=1.10.0",
    "sentence-transformers>=5.2.0",
    "torch>=2.0.0",
    "bitsandbytes>=0.49.0",
]
